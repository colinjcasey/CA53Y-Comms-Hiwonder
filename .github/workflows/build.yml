name: Build firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "LovyanGFX@1.2.33" "ESP8266Audio@2.4.1" "ESP8266SAM@1.1.0"
      - name: Compile
        run: |
          arduino-cli compile -b esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB \
            CA53Y_Hiwonder --build-path build
          # drop the blank padding at the end so browser flashing is quick
          python3 -c "import sys;d=open(sys.argv[1],'rb').read();n=(len(d.rstrip(b'\xff'))+4095)//4096*4096;open(sys.argv[2],'wb').write(d[:n])" \
            build/CA53Y_Hiwonder.ino.merged.bin CA53Y_Hiwonder_S3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: CA53Y_Hiwonder_S3
          path: CA53Y_Hiwonder_S3.bin
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CA53Y_Hiwonder_S3.bin
